# Public demo: production build behind nginx, exposed over HTTPS through a free Cloudflare quick tunnel.
# Uses the SAME database volume and uploads folder as the local setup (same project name + service names).
#   Start:  docker compose -f docker-compose.public.yml up -d --build
#   Link:   docker compose -f docker-compose.public.yml logs tunnel | grep trycloudflare
#   Stop:   docker compose -f docker-compose.public.yml down      (never add -v)
#   Back to local dev:  docker compose -f docker-compose.public.yml down && docker compose up -d
services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    env_file: [.env]
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes: [mysql_data:/var/lib/mysql]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p${MYSQL_ROOT_PASSWORD} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: [.env]
    depends_on:
      db: {condition: service_healthy}
    volumes: [./backend/uploads:/app/uploads]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args: {VITE_API_URL: /api}
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on: [frontend, backend]
    ports: ["8080:80"]          # also reachable locally at http://localhost:8080
    volumes: [./nginx/public.conf:/etc/nginx/conf.d/default.conf:ro]

  tunnel:
    image: cloudflare/cloudflared:2024.12.2
    restart: unless-stopped
    depends_on: [nginx]
    command: tunnel --no-autoupdate --url http://nginx:80

volumes:
  mysql_data:
