services:
  db:
    image: mysql:8.4
    restart: always
    env_file:
      - .env
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    networks: [appnet]

  backend:
    build: ./backend
    restart: always
    env_file:
      - .env
    depends_on:
      - db
    volumes:
      - uploads:/app/uploads
    networks: [appnet]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_API_URL: /api
    restart: always
    networks: [appnet]

  nginx:
    image: nginx:1.27-alpine
    restart: always
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"
    volumes:
      - ./nginx/demo.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [appnet]

volumes:
  mysql_data:
  uploads:

networks:
  appnet:
