# Behind Cloudflare: TLS is terminated by the tunnel. Rate limits key on the real visitor IP.
map $http_cf_connecting_ip $client_ip { "" $remote_addr; default $http_cf_connecting_ip; }
limit_req_zone $client_ip zone=api_limit:10m rate=30r/s;
limit_req_zone $client_ip zone=auth_limit:10m rate=10r/m;

server {
  listen 80;
  server_name _;
  client_max_body_size 50M;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Permissions-Policy "camera=(self), geolocation=(), microphone=()" always;

  location /api/auth/ {
    limit_req zone=auth_limit burst=10 nodelay;
    proxy_pass http://backend:8000/auth/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $client_ip;
    proxy_set_header X-Forwarded-For $client_ip;
    proxy_set_header X-Forwarded-Proto https;
  }
  location /api/ {
    limit_req zone=api_limit burst=60 nodelay;
    proxy_pass http://backend:8000/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $client_ip;
    proxy_set_header X-Forwarded-For $client_ip;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 120s;
  }
  location / {
    proxy_pass http://frontend:80;
    proxy_set_header Host $host;
  }
}
